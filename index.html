<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOGUL: CITY COMMAND</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #05070a;
            --panel: #111827;
            --accent: #00f2ff;
            --secondary: #7000ff;
            --gold: #fbbf24;
            --danger: #ef4444;
            --success: #10b981;
            --text: #f3f4f6;
            --text-dim: #9ca3af;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }

        /* --- ONBOARDING MODAL --- */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 1000; display: flex;
            flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: var(--panel); padding: 30px; border-radius: 20px;
            width: 100%; max-width: 400px; text-align: center;
            border: 1px solid var var(--accent);
        }
        input {
            width: 100%; padding: 12px; margin: 20px 0; border-radius: 8px;
            border: none; background: #1f2937; color: white; font-size: 1rem;
        }
        .city-btn {
            width: 100%; padding: 15px; margin: 10px 0; border: none;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem;
            transition: 0.3s;
        }
        .mumbai-btn { background: #f59e0b; color: black; }
        .ny-btn { background: #3b82f6; color: white; }

        /* --- MAIN HUD --- */
        #hud {
            height: 90px; padding: 10px 20px; background: #000;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--accent);
        }
        .stat-group { display: flex; flex-direction: column; }
        .stat-label { font-size: 0.7rem; color: var(--accent); text-transform: uppercase; }
        .stat-val { font-size: 1.3rem; font-weight: bold; color: var(--gold); }

        /* --- VIEWPORT --- */
        #viewport { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 100px; }

        /* --- CARDS --- */
        .card {
            background: var(--panel); border-radius: 12px; padding: 15px;
            margin-bottom: 12px; border-left: 4px solid var {accent};
        }
        .card h3 { margin: 0; font-size: 1.1rem; }
        .card p { margin: 5px 0; font-size: 0.85rem; color: var(--text-dim); }

        /* --- SUB-VIEW: BUILDING DETAILS --- */
        .section-header { padding: 10px 5px; color: var(--accent); font-weight: bold; border-bottom: 1px solid #374151; margin-top: 20px; }

        /* --- NAVIGATION --- */
        #nav-bar {
            position: fixed; bottom: 0; width: 100%; height: 70px;
            background: var(--panel); display: flex; justify-content: space-around;
            align-items: center; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .nav-item { text-align: center; color: var(--text-dim); font-size: 0.7rem; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 1.5rem; display: block; }

        /* --- END DAY MODAL --- */
        #summary-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; display: none;
            flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        .summary-card {
            background: var(--panel); width: 100%; max-width: 400px;
            padding: 30px; border-radius: 20px; border: 1px solid var(--gold);
        }
        .summary-line { display: flex; justify-content: space-between; margin: 10px 0; }
        .profit { color: var(--success); font-weight: bold; }
        .loss { color: var(--danger); font-weight: bold; }

        .btn-primary {
            width: 100%; padding: 15px; margin-top: 20px; border: none;
            border-radius: 10px; background: var(--accent); font-weight: bold; cursor: pointer;
        }

        /* --- DISTRIBUTION --- */
        .supply-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #374151; }
    </style>
</head>
<body>

    <!-- ONBOARDING -->
    <div id="overlay">
        <div class="modal-content" id="onboarding-ui">
            <h2 style="margin:0">WELCOME MOGUL</h2>
            <p style="color:var(--text-dim)">Enter your name to begin your empire</p>
            <input type="text" id="username-input" placeholder="Your Name...">
            <button class="btn-primary" onclick="submitOnboarding()">START CAREER</button>
        </div>
        <div class="modal-content" id="city-ui" style="display:none">
            <h2 style="margin:0">SELECT HEADQUARTERS</h2>
            <p style="color:var(--text-dim)">Where will you build your empire?</p>
            <button class="city-btn mumbai-btn" onclick="selectCity('Mumbai')">MUMBAI</button>
            <button class="city-btn ny-btn" onclick="selectCity('New York')">NEW YORK</button>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="stat-group">
            <span id="level-display">Level 1 • Novice</span>
            <span id="money-display">$50,000</span>
        </div>
        <div class="stat-group" style="align-items: flex-end;">
            <span class="stat-label">City</span>
            <span id="city-display" class="stat-val">---</span>
        </div>
    </div>

    <!-- VIEWPORT -->
    <div id="viewport"></div>

    <!-- NAVIGATION -->
    <div id="nav-bar">
        <div class="nav-item active" onclick="changeView('city', this)"><span class="nav-icon">🏙️</span>City</div>
        <div class="nav-item" onclick="changeView('dist', this)"><span class="nav-icon">📦</span>Supply</div>
        <div class="nav-item" onclick="changeView('report', this)"><span class="nav-icon">📅</span>Day</div>
    </div>

    <!-- END DAY SUMMARY -->
    <div id="summary-modal">
        <div class="summary-card">
            <h2 style="text-align:center; color:var(--gold)">DAYLY REPORT</h2>
            <div id="summary-details"></div>
            <button class="btn-primary" onclick="closeSummary()">CONTINUE TO NEXT DAY</button>
        </div>
    </div>

    <script>
        // --- DATA STRUCTURE ---
        let game = {
            user: "",
            money: 50000,
            day: 1,
            city: "",
            inventory: { "Coffee": 10, "Paper": 10, "Tech": 10, "Gold": 5 },
            buildings: [], // Will be generated
            dailyStats: { revenue: 0, expenses: 0 }
        };

        const BUSINESS_TYPES = {
            office: [
                { name: "Law Firm", revenue: 1200, supplyReq: "Paper", supplyCost: 2 },
                { name: "Web Design", revenue: 1800, supplyReq: "Tech", supplyCost: 1 },
                { name: "Marketing Agency", revenue: 2500, supplyReq: "Tech", supplyCost: 3 }
            ],
            retail: [
                { name: "Jewelry Shop", revenue: 4000, supplyReq: "Gold", supplyCost: 1 },
                { name: "Coffee Shop", revenue: 800, supplyReq: "Coffee", supplyCost: 5 },
                { name: "Luxury Restaurant", revenue: 3000, supplyReq: "Coffee", supplyCost: 4 }
            ]
        };

        const SUPPLIES = [
            { name: "Coffee", cost: 100 },
            { name: "Paper", cost: 50 },
            { name: "Tech", cost: 500 },
            { name: "Gold", cost: 2000 }
        ];

        // --- ENGINE ---

        function init() {
            const saved = localStorage.getItem('mogul_master_save');
            if (saved) {
                game = JSON.parse(saved);
                document.getElementById('overlay').style.display = 'none';
                changeView('city');
            }
        }

        function submitOnboarding() {
            const name = document.getElementById('username-input').value;
            if (!name) return alert("Enter a name!");
            game.user = name;
            document.getElementById('onboarding-ui').style.display = 'none';
            document.getElementById('city-ui').style.display = 'block';
        }

        function selectCity(cityName) {
            game.city = cityName;
            generateBuildings();
            document.getElementById('overlay').style.display = 'none';
            changeView('city');
            saveGame();
        }

        function generateBuildings() {
            // Create 10 buildings per city
            game.buildings = [];
            for (let i = 1; i <= 10; i++) {
                game.buildings.push({
                    id: i,
                    name: `${game.city} Tower ${i}`,
                    rent: 500 * i,
                    officeUnits: [...BUSINESS_TYPES.office].map(b => ({...b, owned: false})),
                    retailUnits: [...BUSINESS_TYPES.retail].map(b => ({...b, owned: false}))
                });
            }
        }

        function changeView(view, el) {
            if(el) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                el.classList.add('active');
            }
            currentView = view;
            render();
        }

        let currentView = 'city';

        function render() {
            const viewport = document.getElementById('viewport');
            viewport.innerHTML = '';
            updateHUD();

            if (currentView === 'city') {
                game.buildings.forEach(b => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-info">
                            <h3>${b.name}</h3>
                            <p>Rent: $${b.rent}/day</p>
                        </div>
                        <button class="buy-btn" onclick="openBuilding(${b.id})">MANAGE</button>
                    `;
                    viewport.appendChild(card);
                });
            } 
            else if (currentView === 'dist') {
                viewport.innerHTML = `<h2 style="text-align:center">DISTRIBUTION HUB</h2>`;
                SUPPLIES.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-info">
                            <h3>${s.name}</h3>
                            <p>In Stock: ${game.inventory[s.name]}</p>
                            <p>Price: $${s.cost}</p>
                        </div>
                        <button class="buy-btn" onclick="buySupply('${s.name}', ${s.cost})">BUY 10</button>
                    `;
                    viewport.appendChild(card);
                });
            }
            else if (currentView === 'report') {
                viewport.innerHTML = `
                    <div style="text-align:center; padding-top:50px;">
                        <h1 style="font-size:4rem;">📅</h1>
                        <h2>End of Day ${game.day}</h2>
                        <p>Ready to close the books?</p>
                        <button class="btn-primary" onclick="processEndOfDay()">END DAY & CALCULATE</button>
                    </div>
                `;
            }
        }

        // --- BUILDING MANAGEMENT VIEW ---
        function openBuilding(id) {
            const b = game.buildings.find(x => x.id === id);
            const viewport = document.getElementById('viewport');
            viewport.innerHTML = `<button onclick="changeView('city')" style="background:none; border:none; color:var(--accent); cursor:pointer; margin-bottom:10px;">← BACK TO CITY</button>`;
            viewport.innerHTML += `<h2>${b.name}</h2>`;

            // Office Section
            viewport.innerHTML += `<div class="section-header">OFFICE SECTION</div>`;
            b.officeUnits.forEach((u, idx) => {
                viewport.innerHTML += renderBusinessCard(u, 'office', id, idx);
            });

            // Retail Section
            viewport.innerHTML += `<div class="section-header">RETAIL SECTION</div>`;
            b.retailUnits.forEach((u, idx) => {
                viewport.innerHTML += renderBusinessCard(u, 'retail', id, idx);
            });
        }

        function renderBusinessCard(u, type, bId, uIdx) {
            return `
                <div class="card">
                    <div class="card-info">
                        <h3>${u.name}</h3>
                        <p>${u.owned ? '✅ OPERATIONAL' : '❌ UNLEASED'}</p>
                        <p>Revenue: $${u.revenue}/day</p>
                    </div>
                    <button class="buy-btn" onclick="leaseBusiness(${bId}, '${type}', ${uIdx})" ${u.owned ? 'disabled' : ''}>
                        ${u.owned ? 'LEASED' : 'LEASE'}
                    </button>
                </div>
            `;
        }

        // --- ACTIONS ---

        function leaseBusiness(bId, type, uIdx) {
            const b = game.buildings.find(x => x.id === bId);
            const unit = type === 'office' ? b.officeUnits[uIdx] : b.retailUnits[uIdx];
            
            if (game.money >= b.rent) {
                game.money -= b.rent;
                unit.owned = true;
                render();
                openBuilding(bId); // Refresh view
            } else {
                alert("Insufficient funds for building rent!");
            }
        }

        function buySupply(name, cost) {
            if (game.money >= cost) {
                game.money -= cost;
                game.inventory[name] += 10;
                render();
            } else {
                alert("Not enough money!");
            }
        }

        function processEndOfDay() {
            let totalRev = 0;
            let totalExp = 0;

            // 1. Calculate Rent for all buildings (even if not leased, they cost money to hold)
            game.buildings.forEach(b => {
                totalExp += b.rent;
            });

            // 2. Calculate Business Income and check supplies
            game.buildings.forEach(b => {
                [...b.officeUnits, ...b.retailUnits].forEach(u => {
                    if (u.owned) {
                        // Check if we have enough supplies for this business
                        if (game.inventory[u.supplyReq] >= u.supplyCost) {
                            totalRev += u.revenue;
                            game.inventory[u.supplyReq] -= u.supplyCost;
                        } else {
                            // If no supplies, they make 0 and we log a warning
                            console.log(`${u.name} failed due to no supplies!`);
                        }
                    }
                });
            });

            game.dailyStats.revenue = totalRev;
            game.dailyStats.expenses = totalExp;
            game.money += (totalRev - totalExp);
            
            showSummary(totalRev, totalExp);
        }

        function showSummary(rev, exp) {
            const modal = document.getElementById('summary-modal');
            const details = document.getElementById('summary-details');
            const net = rev - exp;

            details.innerHTML = `
                <div class="summary-line"><span>Gross Revenue:</span> <span class="profit">$${rev.toLocaleString()}</span></div>
                <div class="summary-line"><span>Operating Costs:</span> <span class="loss">-$${exp.toLocaleString()}</span></div>
                <hr style="border:0; border-top:1px solid #374151">
                <div class="summary-line" style="font-size:1.5rem"><span>Net Profit:</span> <span class="${net >= 0 ? 'profit' : 'loss'}">$${net.toLocaleString()}</span></div>
            `;
            modal.style.display = 'flex';
        }

        function closeSummary() {
            game.day++;
            document.getElementById('summary-modal').style.display = 'none';
            saveGame();
            render();
        }

        function updateHUD() {
            document.getElementById('money-display').innerText = `$${Math.floor(game.money).toLocaleString()}`;
            document.getElementById('city-display').innerText = game.city;
        }

        function saveGame() {
            localStorage.setItem('mogul_master_save', JSON.stringify(game));
        }

        function updateHUD() {
            document.getElementById('money-display').innerText = `$${Math.floor(game.money).toLocaleString()}`;
            document.getElementById('city-display').innerText = game.city || "---";
        }

        // --- START ---
        window.onload = init;

    </script>
</body>
</html>
