<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOGUL COMMAND CENTER</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #05050a;
            --panel: #0f172a;
            --accent: #00f2ff;
            --secondary: #7000ff;
            --gold: #ffae00;
            --danger: #ff4b2b;
            --success: #00ff88;
            --text: #e2e8f0;
        }

        * { box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- TOP HUD --- */
        #hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: #000;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
        }

        .stat-box { display: flex; flex-direction: column; }
        .stat-label { font-size: 0.7rem; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: var(--gold); }

        /* --- MAIN DASHBOARD LAYOUT --- */
        #dashboard {
            display: grid;
            grid-template-columns: 1fr 320px;
            grid-template-rows: 1fr 150px;
            gap: 10px;
            padding: 10px;
            flex: 1;
            height: calc(100vh - 100px);
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            #dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr 120px;
                overflow-y: auto;
            }
        }

        .panel {
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 10px;
            background: rgba(255,255,255,0.05);
            font-size: 0.8rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: var(--accent);
            text-transform: uppercase;
        }

        /* --- ASSETS PANEL --- */
        .scroll-area { flex: 1; overflow-y: auto; padding: 10px; }

        .asset-card {
            background: rgba(255,255,255,0.03);
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--secondary);
        }

        /* --- MARKET PANEL --- */
        .stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .stock-price { font-weight: bold; }
        .trend-up { color: var(--success); }
        .trend-down { color: var(--danger); }

        .market-controls { display: flex; gap: 5px; }
        .m-btn {
            padding: 4px 8px;
            font-size: 0.7rem;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        .buy-m { background: var(--success); color: #000; }
        .sell-m { background: var(--danger); color: #fff; }

        /* --- TERMINAL PANEL --- */
        #terminal {
            grid-column: span 2;
            background: #000;
            font-size: 0.75rem;
            color: var(--success);
            padding: 10px;
            overflow-y: auto;
        }
        @media (max-width: 768px) { #terminal { grid-column: span 1; } }

        .log-entry { margin-bottom: 4px; border-left: 2px solid var(--success); padding-left: 8px; }
        .log-warn { color: var(--danger); border-color: var(--danger); }

        /* --- BUTTONS --- */
        .action-btn {
            background: var(--accent);
            border: none;
            color: #000;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .action-btn:disabled { background: #444; cursor: not-allowed; }

        /* --- ANIMATIONS --- */
        .pulse { animation: pulse-glow 2s infinite; }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px var(--accent); }
            50% { box-shadow: 0 0 20px var(--accent); }
            100% { box-shadow: 0 0 5px var(--accent); }
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="stat-box">
            <span class="stat-label">Liquid Capital</span>
            <span class="stat-value" id="money-display">$0</span>
        </div>
        <div class="stat-box" style="text-align: right;">
            <span class="stat-label">Net Income/s</span>
            <span class="stat-value" id="pps-display" style="color: var(--accent);">$0</span>
        </div>
    </div>

    <div id="dashboard">
        <!-- ASSETS COLUMN -->
        <div class="panel">
            <div class            ="panel-header">Enterprise Assets</div>
            <div class="scroll-area" id="asset-list">
                <!-- Assets injected here -->
            </div>
        </div>

        <!-- MARKET COLUMN -->
        <div class="panel">
            <div class="panel-header">Global Market (Live)</div>
            <div class="scroll-area" id="market-list">
                <!-- Stocks injected here -->
            </div>
        </div>

        <!-- TERMINAL ROW -->
        <div id="terminal" class="panel">
            <div class="panel-header" style="background:none; border:none; padding:0;">System Log</div>
            <div id="log-content">
                <div class="log-entry">Initializing Mogul OS v4.0...</div>
                <div class="log-entry">System Ready. Welcome, Commander.</div>
            </div>
        </div>
    </div>

    <script>
        // --- GAME DATA ---
        let game = {
            money: 1000,
            totalEarned: 1000,
            assets: [
                { id: 0, name: "Data Center", cost: 500, income: 10, count: 0 },
                { id: 1, name: "Bio-Lab", cost: 5000, income: 85, count: 0 },
                { id: 2, name: "Satellite Net", cost: 50000, income: 600, count: 0 },
                { id: 3, name: "Moon Colony", cost: 1000000, income: 12000, count: 0 }
            ],
            stocks: [
                { id: 0, name: "CYBER-X", price: 50, trend: 0, owned: 0 },
                { id: 1, name: "NEO-VOID", price: 200, trend: 0, owned: 0 },
                { id: 2, name: "AERO-TECH", price: 1000, trend: 0, owned: 0 }
            ]
        };

        // --- ENGINE ---

        function init() {
            const saved = localStorage.getItem('mogulProData');
            if (saved) game = JSON.parse(saved);
            
            updateUI();
            setInterval(mainLoop, 1000); // Passive income
            setInterval(marketLoop, 3000); // Stock fluctuation
            setInterval(saveGame, 10000);
        }

        function mainLoop() {
            let income = 0;
            game.assets.forEach(a => {
                income += (a.count * a.income);
            });
            game.money += income;
            updateUI(income);
        }

        function marketLoop() {
            game.stocks.forEach(s => {
                const change = (Math.random() * 0.4) - 0.18; // -18% to +22%
                const oldPrice = s.price;
                s.price = Math.max(5, s.price * (1 + change));
                s.trend = s.price - oldPrice;
            });
            renderMarket();
            log(`Market updated: ${new Date().toLocaleTimeString()}`, false);
        }

        // --- UI RENDERING ---

        function updateUI(income = 0) {
            document.getElementById('money-display').innerText = `$${Math.floor(game.money).toLocaleString()}`;
            document.getElementById('pps-display').innerText = `$${income.toLocaleString()}/s`;
            renderAssets();
        }

        function renderAssets() {
            const list = document.getElementById('asset-list');
            list.innerHTML = '';
            game.assets.forEach(a => {
                const card = document.createElement('div');
                card.className = 'asset-card';
                card.innerHTML = `
                    <div class="card-info">
                        <h3>${a.name} <small>[${a.count}]</small></h3>
                        <p>Cost: $${Math.floor(a.cost).toLocaleString()} | +$${a.income}/s</p>
                    </div>
                    <button class="action-btn" onclick="buyAsset(${a.id})" ${game.money < a.cost ? 'disabled' : ''}>EXPAND</button>
                `;
                list.appendChild(card);
            });
        }

        function renderMarket() {
            const list = document.getElementById('market-list');
            list.innerHTML = '';
            game.stocks.forEach(s => {
                const trendClass = s.trend >= 0 ? 'trend-up' : 'trend-down';
                const trendSign = s.trend >= 0 ? '▲' : '▼';
                
                const item = document.createElement('div');
                item.className = 'stock-item';
                item.innerHTML = `
                    <div class="card-info">
                        <h3>${s.name}</h3>
                        <p>Owned: ${s.owned}</p>
                    </div>
                    <div class="stat-box" style="align-items:flex-end;">
                        <span class="stock-price ${trendClass}">$${s.price.toFixed(2)} ${trendSign}</span>
                        <div class="market-controls">
                            <button class="m-btn buy-m" onclick="trade(${s.id}, 1)">BUY</button>
                            <button class="m-btn sell-m" onclick="trade(${s.id}, -1)">SELL</button>
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        // --- ACTIONS ---

        function buyAsset(id) {
            let a = game.assets[id];
            if (game.money >= a.cost) {
                game.money -= a.cost;
                a.count++;
                a.cost *= 1.3;
                log(`Acquired ${a.name}. Operational capacity increased.`, false);
                updateUI();
            }
        }

        function trade(id, direction) {
            let s = game.stocks[id];
            if (direction === 1) { // Buy
                if (game.money >= s.price) {
                    game.money -= s.price;
                    s.owned++;
                    log(`Purchased 1 unit of ${s.name}`, false);
                } else {
                    log(`Insufficient funds for ${s.name}`, true);
                }
            } else { // Sell
                if (s.owned > 0) {
                    game.money += s.price;
                    s.owned--;
                    log(`Liquidated ${s.name} position. Profit secured.`, false);
                } else {
                    log(`No ${s.name} holdings to liquidate.`, true);
                }
            }
            renderMarket();
            updateUI();
        }

        function log(msg, isWarn) {
            const content = document.getElementById('log-content');
            const div = document.createElement('div');
            div.className = isWarn ? 'log-entry log-warn' : 'log-entry';
            div.innerText = `> ${msg}`;
            content.prepend(div);
            if (content.childNodes.length > 20) content.lastChild.remove();
        }

        function saveGame() {
            localStorage.setItem('mogulProData', JSON.stringify(game));
        }

        // Start
        init();
        renderMarket(); // Initial market render
    </script>
</body>
</html>
