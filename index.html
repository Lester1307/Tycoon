<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOGUL: WORLD EMPIRE</title>
    <style>
        :root {
            --bg: #05070a;
            --panel: #111827;
            --accent: #00f2ff;
            --secondary: #7000ff;
            --gold: #fbbf24;
            --danger: #ef4444;
            --success: #10b981;
            --text: #f3f4f6;
            --text-dim: #9ca3af;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }

        /* --- SCENE SYSTEM --- */
        .scene {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column;
        }
        .scene.active { display: flex; }

        /* --- SCENE 1: SPLASH --- */
        #splash-scene {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1000&q=80');
            background-size: cover; background-position: center;
            justify-content: center; align-items: center; text-align: center;
        }
        .splash-title { font-size: 3.5rem; font-weight: 900; text-shadow: 0 0 20px rgba(0,0,0,1); margin: 0; color: white; }
        .splash-subtitle { color: var(--gold); font-size: 1.2rem; letter-spacing: 5px; margin-bottom: 40px; text-transform: uppercase; }
        .btn-get-started {
            padding: 15px 50px; font-size: 1.2rem; font-weight: bold; border-radius: 40px;
            border: none; background: var(--accent); color: black; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
        }

        /* --- SCENE 2: PROFILE (NAME ENTRY) --- */
        #profile-scene { justify-content: center; align-items: center; padding: 20px; }
        .modal {
            background: var(--panel); padding: 40px 30px; border-radius: 24px;
            width: 100%; max-width: 400px; text-align: center;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .modal h2 { margin-top: 0; font-size: 1.8rem; }
        input {
            width: 100%; padding: 15px; margin: 25px 0; border-radius: 12px;
            border: 1px solid #374151; background: #1f2937; color: white; font-size: 1.1rem; outline: none;
        }
        input:focus { border-color: var(--accent); }
        .btn-primary {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: var(--accent); color: black; font-weight: bold; font-size: 1.1rem; cursor: pointer;
        }

        /* --- SCENE 3: CITY SELECTION --- */
        #city-scene { padding: 20px; overflow-y: auto; }
        .city-card {
            position: relative; width: 100%; height: 160px; border-radius: 15px;
            overflow: hidden; margin-bottom: 15px; cursor: pointer; transition: 0.3s;
        }
        .city-card img { width: 100%; height: 100%; object-fit: cover; }
        .city-card:hover { transform: translateY(-5px); }
        .city-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
        }
        .city-overlay h3 { margin: 0; font-size: 1.4rem; }

        /* --- SCENE 4: MAIN DASHBOARD --- */
        #dashboard-scene { padding: 0; }
        #dashboard-header {
            padding: 20px; background: #000; border-bottom: 2px solid var(--accent);
            display: flex; justify-content: space-between; align-items: center;
        }
        .user-info-mini { display: flex; align-items: center; gap: 10px; }
        .profile-circle { 
            width: 40px; height: 40px; background: var(--secondary); 
            border-radius: 50%; display: flex; justify-content: center; 
            align-items: center; font-weight: bold; cursor: pointer;
        }
        #money-display { font-size: 1.6rem; font-weight: 800; color: var(--gold); }
        #city-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; }

        #viewport { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 100px; }
        .card {
            background: var(--panel); border-radius: 15px; padding: 15px;
            margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .card-info h3 { margin: 0; font-size: 1rem; color: var(--accent); }
        .card-info p { margin: 4px 0 0; font-size: 0.8rem; color: var(--text-dim); }
        .buy-btn {
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            border: none; color: white; padding: 10px 14px; border-radius: 8px; font-weight: bold;
        }

        /* --- NAVIGATION --- */
        #nav-bar {
            position: fixed; bottom: 0; width: 100%; height: 70px;
            background: rgba(17, 24, 39, 0.95); display: flex;
            justify-content: space-around; align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1); padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { text-align: center; color: var(--text-dim); font-size: 0.7rem; font-weight: bold; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 1.4rem; display: block; }

        /* --- REUSABLE MODAL --- */
        #name-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 5000; display: none;
            justify-content: center; align-items: center; padding: 20px;
        }
    </style>
</head>
<body>

    <!-- SCENE 1: SPLASH SCREEN -->
    <div id="splash-scene" class="scene active">
        <h1 class="splash-title">BUSINESS INC</h1>
        <h2 class="splash-subtitle">TYCOON SIMULATOR</h2>
        <button class="btn-get-started" onclick="goToProfile()">GET STARTED</button>
    </div>

    <!-- SCENE 2: PROFILE ENTRY -->
    <div id="profile-scene" class="scene">
        <div class="modal">
            <h2>IDENTIFY YOURSELF</h2>
            <p style="color:var(--text-dim)">Enter your name to begin your journey</p>
            <input type="text" id="username-input" placeholder="Enter Name...">
            <button class="btn-primary" onclick="saveUsername()">CONTINUE</button>
        </div>
    </div>

    <!-- SCENE 3: CITY SELECTION -->
    <div id="city-scene" class="scene">
        <h2 style="text-align:center">SELECT HEADQUARTERS</h2>
        <div class="city-card" onclick="selectCity('London')">
            <img src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=500&q=80">
            <div class="city-overlay"><h3>London</h3><p>High Luxury Market</p></div>
        </div>
        <div class="city-card" onclick="selectCity('Mumbai')">
            <img src="https://images.unsplash.com/photo-1566552881560-0be862a7c445?auto=format&fit=crop&w=500&q=80">
            <div class="city-overlay"><h3>Mumbai</h3><p>Massive Scale Market</p></div>
        </div>
        <div class="city-card" onclick="selectCity('New York')">
            <img src="https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?auto=format&fit=crop&w=500&q=80">
            <div class="city-overlay"><h3>New York</h3><p>The Global Hub</p></div>
        </div>
    </div>

    <!-- SCENE 4: MAIN DASHBOARD -->
    <div id="dashboard-scene" class="scene">
        <div id="dashboard-header">
            <div class="user-info-mini">
                <div class="profile-circle" onclick="openNameModal()">👤</div>
                <div>
                    <div id="user-name-display" style="font-weight:bold; font-size:0.9rem;">Player</div>
                    <div id="city-label">City Name</div>
                </div>
            </div>
            <div id="money-display">$0</div>
        </div>

        <div id="viewport">
            <!-- Content injected by JS -->
        </div>

        <div id="nav-bar">
            <div class="nav-item active" onclick="changeView('city', this)"><span class="nav-icon">🏙️</span>City</div>
            <div class="nav-item" onclick="changeView('assets', this)"><span class="nav-icon">🏢</span>Empire</div>
            <div class="nav-item" onclick="changeView('supply', this)"><span class="nav-icon">📦</span>Supply</div>
        </div>
    </div>

    <!-- NAME CHANGE MODAL -->
    <div id="name-modal">
        <div class="modal">
            <h2>CHANGE NAME</h2>
            <input type="text" id="new-name-input">
            <button class="btn-primary" onclick="updateUsername()">SAVE NEW NAME</button>
            <button onclick="closeNameModal()" style="background:none; border:none; color:var(--text-dim); margin-top:15px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <script>
        // --- GAME STATE ---
        let game = {
            user: "",
            money: 50000,
            city: "",
            assets: [
                { id: 0, name: "Coffee Shop", cost: 500, income: 50, count: 0 },
                { id: 1, name: "Law Firm", cost: 2500, income: 300, count: 0 },
                { id: 2, name: "Tech Startup", cost: 15000, income: 1800, count: 0 }
            ]
        };

        let currentView = 'city';

        // --- SCENE CONTROLLER ---
        function showScene(sceneId) {
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            document.getElementById(sceneId + '-scene').classList.add('active');
        }

        // --- FLOW LOGIC ---
        function goToProfile() {
            showScene('profile');
        }

        function saveUsername() {
            const name = document.getElementById('username-input').value;
            if (!name) return alert("Please enter a name");
            game.user = name;
            showScene('city');
        }

        function selectCity(cityName) {
            game.city = cityName;
            showScene('dashboard');
            changeView('city');
            updateHUD();
        }

        // --- DASHBOARD LOGIC ---
        function changeView(view, el) {
            currentView = view;
            if(el) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                el.classList.add('active');
            }
            render();
        }

        function updateHUD() {
            document.getElementById('user-name-display').innerText = game.user;
            document.getElementById('city-label').innerText = game.city;
            document.getElementById('money-display').innerText = `$${Math.floor(game.money).toLocaleString()}`;
        }

        function render() {
            const viewport = document.getElementById('viewport');
            viewport.innerHTML = '';
            updateHUD();

            if (currentView === 'city') {
                viewport.innerHTML = `<h2 style="text-align:center">Welcome to ${game.city}</h2><p style="text-align:center; color:var(--text-dim)">Tap 'Empire' to manage your assets.</p>`;
            } 
            else if (currentView === 'assets') {
                game.assets.forEach(a => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-info">
                            <h3>${a.name} <small>[${a.count}]</small></h3>
                            <p>Cost: $${a.cost.toLocaleString()} | +$${a.income}/s</p>
                        </div>
                        <button class="buy-btn" onclick="buyAsset(${a.id})" ${game.money < a.cost ? 'disabled' : ''}>BUY</button>
                    `;
                    viewport.appendChild(card);
                });
            }
            else if (currentView === 'supply') {
                viewport.innerHTML = `<div class="card"><h3>Supply Center</h3><p>Coming in next update!</p></div>`;
            }
        }

        function buyAsset(id) {
            const a = game.assets.find(x => x.id === id);
            if (game.money >= a.cost) {
                game.money -= a.cost;
                a.count++;
                a.cost = Math.floor(a.cost * 1.4);
                render();
            }
        }

        // --- NAME CHANGE LOGIC ---
        function openNameModal() {
            document.getElementById('name-modal').style.display = 'flex';
            document.getElementById('new-name-input').value = game.user;
        }

        function closeNameModal() {
            document.getElementById('name-modal').style.display = 'none';
        }

        function updateUsername() {
            const newName = document.getElementById('new-name-input').value;
            if(newName) {
                game.user = newName;
                updateHUD();
                closeNameModal();
            }
        }

        // --- GAME LOOP ---
        setInterval(() => {
            let income = 0;
            game.assets.forEach(a => income += (a.count * a.income));
            game.money += income;
            updateHUD();
        }, 1000);

        // Initialize
        window.onload = () => {
            const saved = localStorage.getItem('mogul_master_save');
            if(saved) {
                game = JSON.parse(saved);
                showScene('dashboard');
                changeView('city');
            } else {
                showScene('splash');
            }
        };

        // Auto-save
        setInterval(() => {
            localStorage.setItem('mogul_master_save', JSON.stringify(game));
        }, 10000);

    </script>
</body>
</html>
