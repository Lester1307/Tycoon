<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOGUL: EMPIRE COMMAND</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #05070a;
            --panel: #111827;
            --accent: #00f2ff;
            --secondary: #7000ff;
            --gold: #fbbf24;
            --danger: #ef4444;
            --success: #10b981;
            --text: #f3f4f6;
            --text-dim: #9ca3af;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Roboto, sans-serif; }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* --- TOP HUD --- */
        #hud {
            padding: 20px;
            background: linear-gradient(to bottom, #111827, #05070a);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        #money-display { font-size: 2.5rem; font-weight: 800; color: var(--gold); display: block; }
        #level-display { font-size: 0.8rem; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        #xp-bar-container {
            width: 100%; height: 4px; background: #374151; margin-top: 10px; border-radius: 2px; overflow: hidden;
        }
        #xp-bar-fill { width: 0%; height: 100%; background: var(--accent); transition: width 0.3s; }

        /* --- MAIN VIEWPORT --- */
        #viewport {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 100px; /* Space for bottom nav */
        }

        /* --- CARDS & UI --- */
        .card {
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card-info h3 { margin: 0; font-size: 1.1rem; color: var(--text); }
        .card-info p { margin: 4px 0 0; font-size: 0.85rem; color: var(--text-dim); }

        .buy-btn {
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            border: none; color: white;
            padding: 10px 16px; border-radius: 10px;
            font-weight: bold; font-size: 0.8rem;
            cursor: pointer;
        }
        .buy-btn:disabled { background: #374151; opacity: 0.5; }

        /* --- BOTTOM NAVIGATION --- */
        #nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-dim);
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 1.4rem; margin-bottom: 4px; }

        /* --- SPECIAL SECTIONS --- */
        .market-ticker {
            background: #000; color: var(--success);
            padding: 5px; font-size: 0.7rem; text-align: center;
            border-bottom: 1px solid var(--accent);
        }

        .research-locked { opacity: 0.5; filter: grayscale(1); }

        /* --- CLICKER ELEMENT --- */
        #clicker-container {
            text-align: center;
            padding: 40px 0;
        }
        #big-tap {
            width: 140px; height: 140px;
            background: radial-gradient(circle, var(--accent), var(--secondary));
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
            cursor: pointer;
        }
        #big-tap:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <div id="hud">
        <span id="level-display">Level 1 • Novice</span>
        <span id="money-display">$0</span>
        <div id="xp-bar-container"><div id="xp-bar-fill"></div></div>
    </div>

    <div id="viewport">
        <!-- Content injected by JS -->
    </div>

    <div id="nav-bar">
        <div class="nav-item active" onclick="setView('tap')"><span class="nav-icon">🖱️</span>Tap</div>
        <div class="nav-item" onclick="setView('assets')"><span class="nav-icon">🏢</span>Assets</div>
        <div class="nav-item" onclick="setView('lab')"><span class="nav-icon">🔬</span>Lab</div>
        <div class="nav-item" onclick="setView('market')"><span class="nav-icon">📈</span>Market</div>
    </div>

    <script>
        // --- GAME ENGINE ---
        const state = {
            money: 0,
            xp: 0,
            level: 1,
            nextLevelXp: 100,
            lastSave: Date.now(),
            clickPower: 1,
            
            assets: [
                { id: 0, name: "Lemonade Stand", cost: 15, income: 1, count: 0, manager: false },
                { id: 1, name: "Cyber Cafe", cost: 150, income: 12, count: 0, manager: false },
                { id: 2, name: "Cloud Farm", cost: 2000, income: 95, count: 0, manager: false },
                { id: 3, name: "Quantum Hub", cost: 25000, income: 650, count: 0, manager: false }
            ],
            
            research: [
                { id: 0, name: "AI Logic", cost: 500, effect: "Double Tap Power", type: "click", mult: 2, unlocked: false, reqLevel: 2 },
                { id: 1, name: "Auto-Manager", cost: 5000, effect: "Automate Assets", type: "auto", mult: 1, unlocked: false, reqLevel: 5 },
                { id: 2, name: "Neural Link", cost: 50000, effect: "3x All Income", type: "income", mult: 3, unlocked: false, reqLevel: 10 }
            ],

            market: [
                { id: 0, name: "BIT-COIN", price: 100, trend: 0, owned: 0 },
                { id: 1, name: "NEO-STOCK", price: 500, trend: 0, owned: 0 }
            ]
        };

        let currentView = 'tap';

        // --- INITIALIZATION ---
        function init() {
            const saved = localStorage.getItem('mogul_pro_save');
            if (saved) {
                const loaded = JSON.parse(saved);
                Object.assign(state, loaded);
                calculateOfflineEarnings();
            }
            
            setInterval(gameLoop, 1000);
            setInterval(marketLoop, 5000);
            setInterval(saveGame, 15000);
            
            render();
        }

        function calculateOfflineEarnings() {
            const now = Date.now();
            const diff = Math.floor((now - state.lastSave) / 1000);
            if (diff > 60) {
                let income = 0;
                state.assets.forEach(a => income += (a.count * a.income));
                const earned = income * diff;
                state.money += earned;
                alert(`Welcome back! While you were gone, your empire earned $${earned.toLocaleString()}`);
            }
        }

        // --- CORE LOOPS ---
        function gameLoop() {
            let income = 0;
            state.assets.forEach(a => {
                // If research "Auto-Manager" is unlocked, income is always active
                income += (a.count * a.income);
            });

            // Apply Research Multipliers
            state.research.filter(r => r.unlocked && r.type === 'income').forEach(r => {
                income *= r.mult;
            });

            state.money += income;
            updateHUD();
        }

        function marketLoop() {
            state.market.forEach(s => {
                const change = (Math.random() * 0.4) - 0.18; 
                s.price = Math.max(10, s.price * (1 + change));
                s.trend = change;
            });
            if(currentView === 'market') render();
        }

        // --- ACTIONS ---
        function tap() {
            state.money += state.clickPower;
            addXp(5);
            render();
        }

        function buyAsset(id) {
            const a = state.assets[id];
            if (state.money >= a.cost) {
                state.money -= a.cost;
                a.count++;
                a.cost *= 1.3;
                addXp(20);
                render();
            }
        }

        function buyResearch(id) {
            const r = state.research[id];
            if (state.money >= r.cost && !r.unlocked) {
                state.money -= r.cost;
                r.unlocked = true;
                if (r.type === 'click') state.clickPower *= r.mult;
                addXp(500);
                render();
            }
        }

        function addXp(amt) {
            state.xp += amt;
            if (state.xp >= state.nextLevelXp) {
                state.level++;
                state.xp = 0;
                state.nextLevelXp *= 1.5;
                // Level up rewards
                state.clickPower += (state.level * 2);
            }
        }

        // --- UI SYSTEM ---
        function setView(view) {
            currentView = view;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            render();
        }

        function updateHUD() {
            document.getElementById('money-display').innerText = `$${Math.floor(state.money).toLocaleString()}`;
            document.getElementById('level-display').innerText = `Level ${state.level} • ${getRank()}`;
            const xpPercent = (state.xp / state.nextLevelXp) * 100;
            document.getElementById('xp-bar-fill').style.width = `${xpPercent}%`;
        }

        function getRank() {
            if (state.level < 5) return "Novice";
            if (state.level < 15) return "Manager";
            if (state.level < 30) return "CEO";
            return "Overlord";
        }

        function render() {
            updateHUD();
            const viewport = document.getElementById('viewport');
            viewport.innerHTML = '';

            if (currentView === 'tap') {
                viewport.innerHTML = `
                    <div id="clicker-container">
                        <div id="big-tap" onclick="tap()">TAP<br>PROFIT</div>
                        <p style="color:var(--text-dim); margin-
